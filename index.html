<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Personal AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;--surface:#0d1018;--surface2:#13161f;
  --border:rgba(255,255,255,0.06);--accent:#5effc3;--accent2:#4a7fff;
  --text:#dde1ec;--muted:#424859;--muted2:#636878;
  --glow:0 0 60px rgba(94,255,195,0.08);
  --font-head:'Syne',sans-serif;--font-mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);display:flex;flex-direction:column;cursor:none}

#cur{position:fixed;width:10px;height:10px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen}
#cur-r{position:fixed;width:32px;height:32px;border:1px solid rgba(94,255,195,.3);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .16s ease,width .18s,height .18s}

.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(94,255,195,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(94,255,195,.018) 1px,transparent 1px);background-size:52px 52px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(110px);pointer-events:none;z-index:0}
.o1{width:500px;height:500px;top:-180px;left:-150px;background:rgba(94,255,195,.05)}
.o2{width:400px;height:400px;bottom:-140px;right:-120px;background:rgba(74,127,255,.06)}

.shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 40px;border-bottom:1px solid var(--border);
  background:rgba(7,9,14,.8);backdrop-filter:blur(20px);flex-shrink:0;
}
.logo{font-family:var(--font-head);font-size:1rem;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.logo-pulse{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.header-right{display:flex;align-items:center;gap:12px}
.status-pill{display:flex;align-items:center;gap:6px;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(94,255,195,.18);padding:5px 12px;border-radius:100px;background:rgba(94,255,195,.04)}
.status-pill::before{content:'';width:5px;height:5px;background:var(--accent);border-radius:50%;box-shadow:0 0 6px var(--accent)}
.model-tag{font-size:.62rem;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase}

.main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 40px}

/* empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fadeUp .7s ease both}
.empty-state.hidden{display:none}
.big-label{font-family:var(--font-head);font-size:clamp(2.8rem,7vw,5.5rem);font-weight:800;line-height:.95;letter-spacing:-.03em;text-align:center}
.big-label .acc{color:var(--accent)}
.big-label .dim{display:block;font-size:.38em;font-weight:400;color:var(--muted2);font-style:italic;letter-spacing:.01em;margin-top:14px}
.hint-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:40px}
.hint{font-size:.7rem;color:var(--muted2);border:1px solid var(--border);padding:6px 14px;border-radius:100px;cursor:pointer;transition:border-color .2s,color .2s}
.hint:hover{border-color:rgba(94,255,195,.28);color:var(--accent)}

/* conversation */
.convo{flex:1;overflow-y:auto;padding:28px 0 0;display:flex;flex-direction:column;gap:0;scroll-behavior:smooth}
.convo::-webkit-scrollbar{width:3px}
.convo::-webkit-scrollbar-track{background:transparent}
.convo::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.convo.hidden{display:none}

.turn{display:grid;grid-template-columns:28px 1fr;gap:0 16px;padding:20px 0;border-bottom:1px solid var(--border);animation:msgIn .3s ease both}
.turn:last-child{border-bottom:none}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.turn-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-family:var(--font-head);font-weight:800;flex-shrink:0;margin-top:2px}
.turn.user .turn-icon{background:var(--surface2);border:1px solid var(--border);color:var(--muted2)}
.turn.ai .turn-icon{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}

.turn-role{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px}
.turn.user .turn-role{color:var(--muted)}
.turn.ai .turn-role{color:var(--accent)}

.turn-text{font-size:.84rem;line-height:1.8;color:var(--text);word-break:break-word}
.turn-text code{background:rgba(94,255,195,.08);color:var(--accent);padding:1px 6px;border-radius:4px;font-size:.88em}
.turn-text strong{color:#fff}
.turn-text em{color:var(--muted2)}

.typing{display:flex;align-items:center;gap:5px;padding:4px 0}
.typing span{width:5px;height:5px;background:var(--accent);border-radius:50%;animation:dot 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* input */
.input-bar{flex-shrink:0;padding:20px 0 28px}
.input-wrap{display:flex;align-items:flex-end;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 12px 12px 18px;transition:border-color .2s,box-shadow .2s}
.input-wrap:focus-within{border-color:rgba(94,255,195,.3);box-shadow:0 0 0 3px rgba(94,255,195,.05),var(--glow)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font-mono);font-size:.84rem;line-height:1.6;resize:none;min-height:24px;max-height:140px}
textarea::placeholder{color:var(--muted)}
.send{width:40px;height:40px;border-radius:8px;border:none;background:var(--accent);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s,box-shadow .15s,opacity .2s}
.send:hover{transform:scale(1.06);box-shadow:0 0 18px rgba(94,255,195,.4)}
.send:active{transform:scale(.96)}
.send:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.send svg{width:16px;height:16px}
.input-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:0 4px}
.input-meta span{font-size:.62rem;color:var(--muted);letter-spacing:.06em}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(20,6,10,.95);border:1px solid rgba(255,80,100,.3);color:#ff6b7a;font-size:.75rem;padding:10px 20px;border-radius:100px;opacity:0;transition:all .28s ease;pointer-events:none;z-index:1000;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){
  header{padding:16px 20px}
  .main{padding:0 20px}
  .big-label{font-size:2.4rem}
  .input-bar{padding:16px 0 20px}
}
</style>
</head>
<body>
<div id="cur"></div>
<div id="cur-r"></div>
<div class="grid"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="toast" id="toast"></div>

<div class="shell">
  <header>
    <div class="logo">
      <div class="logo-pulse"></div>
      PERSONAL<span style="color:var(--accent)">·AI</span>
    </div>
    <div class="header-right">
      <div class="model-tag">Ollama · llama3.2</div>
      <div class="status-pill">Online</div>
    </div>
  </header>

  <div class="main">
    <div class="empty-state" id="emptyState">
      <div class="big-label">
        Ask me<br><span class="acc">anything.</span>
        <span class="dim">your personal ai — always here.</span>
      </div>
      <div class="hint-row">
        <div class="hint" onclick="useHint(this)">Who am I?</div>
        <div class="hint" onclick="useHint(this)">What am I learning?</div>
        <div class="hint" onclick="useHint(this)">Explain transformers simply</div>
        <div class="hint" onclick="useHint(this)">Help me with Python</div>
      </div>
    </div>

    <div class="convo hidden" id="convo"></div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="inp" placeholder="Type your question..." rows="1"></textarea>
        <button class="send" id="sendBtn" onclick="send()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-meta">
        <span>↵ send &nbsp;·&nbsp; shift+↵ newline</span>
        <span id="cc">0 / 500</span>
      </div>
    </div>
  </div>
</div>

<script>
const WEBHOOK = 'http://127.0.0.1:5678/webhook/chat';

// cursor
const cur=document.getElementById('cur'),curR=document.getElementById('cur-r');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function tick(){
  cur.style.left=mx+'px';cur.style.top=my+'px';
  rx+=(mx-rx)*.13;ry+=(my-ry)*.13;
  curR.style.left=rx+'px';curR.style.top=ry+'px';
  requestAnimationFrame(tick);
})();
document.querySelectorAll('button,.hint,textarea').forEach(el=>{
  el.addEventListener('mouseenter',()=>{curR.style.width='48px';curR.style.height='48px'});
  el.addEventListener('mouseleave',()=>{curR.style.width='32px';curR.style.height='32px'});
});

// textarea
const inp=document.getElementById('inp'),cc=document.getElementById('cc');
inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,140)+'px';
  cc.textContent=inp.value.length+' / 500';
});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

function useHint(el){inp.value=el.textContent;inp.dispatchEvent(new Event('input'));inp.focus()}

// send
let busy=false;
async function send(){
  const q=inp.value.trim();
  if(!q||busy)return;
  busy=true;

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('convo').classList.remove('hidden');

  addTurn('user',q);
  inp.value='';inp.style.height='auto';cc.textContent='0 / 500';
  document.getElementById('sendBtn').disabled=true;

  const tid=addTyping();
  try{
    const res=await fetch(WEBHOOK,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:q})
    });
    const raw=await res.text();
    let ans;
    try{
      const d=JSON.parse(raw);
      const item=Array.isArray(d)?d[0]:d;
      ans=item.output||item.response||item.text||item.message||item.answer||raw;
    }catch{ans=raw}
    removeTyping(tid);
    addTurn('ai',ans);
  }catch(err){
    removeTyping(tid);
    addTurn('ai','⚠ Could not reach n8n. Make sure the workflow is active.');
    toast('Connection failed — check n8n is running');
  }
  busy=false;
  document.getElementById('sendBtn').disabled=false;
  inp.focus();
}

function addTurn(role,text){
  const c=document.getElementById('convo');
  const d=document.createElement('div');
  d.className='turn '+role;
  d.innerHTML=`
    <div class="turn-icon">${role==='ai'?'P':'M'}</div>
    <div class="turn-body">
      <div class="turn-role">${role==='ai'?'Personal AI':'You'}</div>
      <div class="turn-text">${fmt(text)}</div>
    </div>`;
  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
}

function addTyping(){
  const c=document.getElementById('convo');
  const id='ty'+Date.now();
  const d=document.createElement('div');
  d.className='turn ai';d.id=id;
  d.innerHTML=`<div class="turn-icon">P</div><div class="turn-body"><div class="turn-role">Personal AI</div><div class="typing"><span></span><span></span><span></span></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
  return id;
}
function removeTyping(id){const e=document.getElementById(id);if(e)e.remove()}

function fmt(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
