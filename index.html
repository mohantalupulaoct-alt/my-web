<!DOCTYPE html>
<html>
<head>
  <title>AI Test</title>
</head>
<body>

  <h2>Ask my AI</h2>

  <input type="text" id="question" placeholder="Type your question..." />
  <button onclick="ask()">Send</button>

  <p id="answer">Answer will appear here...</p>

  <script>
    async function ask() {
      // 1. Grab what user typed
      const question = document.getElementById("question").value;

      // 2. Show loading
      document.getElementById("answer").innerText = "Thinking...";

      // 3. Send to n8n webhook
      const response = await fetch("http://localhost:5678/webhook-test/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: question })
      });

      // 4. Read the reply
      const data = await response.json();

      // 5. Show answer on page
      const answer = Array.isArray(data) ? data[0].output : data.output;
      document.getElementById("answer").innerText = answer;
    }
  </script>

</body>
</html>
